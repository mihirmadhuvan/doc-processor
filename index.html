<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Logistics — Document Processor</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161c2c;
    --panel-2: #1c2337;
    --border: #2a3247;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f7cff;
    --warn: #e0a13b;
    --ok: #3bc48f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .cvstatus {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cvstatus .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--warn);
    flex-shrink: 0;
  }
  .cvstatus.ready .dot {
    background: var(--ok);
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s ease;
    display: block;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
  }
  .dropzone p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .dropzone input {
    display: none;
  }
  .count {
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .groups {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .group-header .type {
    font-size: 14px;
    font-weight: 600;
  }
  .group-header .filecount {
    font-size: 12px;
    color: var(--muted);
  }
  .group.unclassified .group-header {
    background: rgba(224, 161, 59, 0.1);
  }
  .group.unclassified .group-header .type {
    color: var(--warn);
  }
  .fileitem {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .fileitem:last-child {
    border-bottom: none;
  }
  .fileitem .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .fileitem .left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    min-width: 0;
  }
  .pagebadge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(79, 124, 255, 0.12);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .fileitem .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fileitem .size {
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }
  .preview {
    margin-top: 10px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .preview canvas, .preview img {
    max-width: 140px;
    max-height: 140px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
  }
  .preview .status {
    font-size: 11px;
    color: var(--muted);
  }
  .preview .status.ok {
    color: var(--ok);
  }
  .preview .status.warn {
    color: var(--warn);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Document Processor — V0.1</h1>
  <div class="subtitle">Step 4: images are auto-cropped to the document edges.</div>
  <div class="cvstatus" id="cvstatus"><span class="dot"></span><span id="cvstatusText">Loading edge-detection engine…</span></div>

  <label class="dropzone" id="dropzone">
    <p>Click to choose files, or drag and drop them here</p>
    <input type="file" id="fileInput" multiple>
  </label>

  <div class="count" id="count"></div>
  <div class="groups" id="groups"></div>
</div>

<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onOpenCvScriptLoaded();" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@master/src/jscanify.min.js"></script>

<script>
  // ---- OpenCV / jscanify readiness ----
  let cvReady = false;
  let resolveCvReady;
  const cvReadyPromise = new Promise(resolve => { resolveCvReady = resolve; });

  function onOpenCvScriptLoaded() {
    cv['onRuntimeInitialized'] = () => {
      cvReady = true;
      const statusEl = document.getElementById('cvstatus');
      statusEl.classList.add('ready');
      document.getElementById('cvstatusText').textContent = 'Edge-detection engine ready';
      resolveCvReady();
    };
  }

  // ---- Document types & aliases (editable config for now; config screen comes later) ----
  const DOCUMENT_TYPES = [
    { seq: 1,  name: "Police Verification",   aliases: ["police"] },
    { seq: 2,  name: "Resume",                aliases: ["resume"] },
    { seq: 3,  name: "Salary Slips",          aliases: ["salary slips"] },
    { seq: 4,  name: "Self Aadhaar",          aliases: ["aadhar"] },
    { seq: 5,  name: "HSC Marksheet",         aliases: ["hsc", "12th"] },
    { seq: 6,  name: "SSC Marksheet",         aliases: ["ssc", "10th"] },
    { seq: 7,  name: "Graduation",            aliases: ["graduation"] },
    { seq: 8,  name: "Mother Aadhaar Card",   aliases: ["mother aadhar"] },
    { seq: 9,  name: "Father Aadhaar Card",   aliases: ["father aadhar"] },
    { seq: 10, name: "Medical Fitness",       aliases: ["medical"] },
    { seq: 11, name: "PAN",                   aliases: ["pan"] },
    { seq: 12, name: "Passbook",              aliases: ["passbook", "bank account"] },
  ];

  const ALIAS_INDEX = DOCUMENT_TYPES.flatMap(type =>
    type.aliases.map(alias => ({ alias: alias.toLowerCase(), type }))
  );

  function classify(filename) {
    const lower = filename.toLowerCase();
    let best = null;
    for (const entry of ALIAS_INDEX) {
      if (lower.includes(entry.alias)) {
        if (!best || entry.alias.length > best.alias.length) best = entry;
      }
    }
    return best ? best.type : null;
  }

  function extractPageNumber(filename) {
    const base = filename.replace(/\.[^/.]+$/, '');
    const match = base.match(/(\d+)\s*$/);
    return match ? parseInt(match[1], 10) : null;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ---- Auto-crop ----
  // Crops to the detected document edges without resizing beyond the
  // original pixel dimensions (no upscaling, no recompression).
  function autoCropImage(imgEl) {
    try {
      const scanner = new jscanify();
      const result = scanner.extractPaper(imgEl, imgEl.naturalWidth, imgEl.naturalHeight);
      return result; // canvas, or null if no document edges were found
    } catch (err) {
      return null;
    }
  }

  // ---- UI wiring ----
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const groupsEl = document.getElementById('groups');
  const countEl = document.getElementById('count');
  let previewCounter = 0;

  function buildGroups(files) {
    const byType = new Map();
    const unclassified = [];

    files.forEach(file => {
      const type = classify(file.name);
      const pageNum = extractPageNumber(file.name);
      const entry = { file, pageNum, previewId: 'preview-' + (previewCounter++) };

      if (!type) {
        unclassified.push(entry);
        return;
      }
      if (!byType.has(type.name)) byType.set(type.name, []);
      byType.get(type.name).push(entry);
    });

    for (const entries of byType.values()) {
      entries.sort((a, b) => {
        if (a.pageNum === null && b.pageNum === null) return 0;
        if (a.pageNum === null) return 1;
        if (b.pageNum === null) return -1;
        return a.pageNum - b.pageNum;
      });
    }

    return { byType, unclassified };
  }

  function renderGroupCard(title, entries, isUnclassified) {
    const card = document.createElement('div');
    card.className = 'group' + (isUnclassified ? ' unclassified' : '');

    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML =
      `<div class="type">${title}</div>` +
      `<div class="filecount">${entries.length} file${entries.length === 1 ? '' : 's'}</div>`;
    card.appendChild(header);

    entries.forEach((entry, i) => {
      const item = document.createElement('div');
      item.className = 'fileitem';

      const isImage = entry.file.type.startsWith('image/');
      const pageBadge = !isUnclassified ? `<span class="pagebadge">Page ${i + 1}</span>` : '';

      item.innerHTML =
        `<div class="row">` +
          `<div class="left">${pageBadge}<span class="name">${entry.file.name}</span></div>` +
          `<span class="size">${formatSize(entry.file.size)}</span>` +
        `</div>` +
        (isImage
          ? `<div class="preview" id="${entry.previewId}"><span class="status">Waiting for edge detection…</span></div>`
          : `<div class="preview"><span class="status">Not an image — no crop preview in this step</span></div>`);

      card.appendChild(item);
    });

    return card;
  }

  async function processCropPreview(entry) {
    const container = document.getElementById(entry.previewId);
    if (!container) return;

    await cvReadyPromise;
    container.querySelector('.status').textContent = 'Detecting document edges…';

    const url = URL.createObjectURL(entry.file);
    const img = new Image();
    img.onload = () => {
      const cropped = autoCropImage(img);
      container.innerHTML = '';

      if (cropped) {
        cropped.classList.add('cropped');
        container.appendChild(cropped);
        const status = document.createElement('span');
        status.className = 'status ok';
        status.textContent = 'Auto-cropped';
        container.appendChild(status);
      } else {
        const thumb = document.createElement('img');
        thumb.src = url;
        container.appendChild(thumb);
        const status = document.createElement('span');
        status.className = 'status warn';
        status.textContent = "Couldn't detect edges — using original";
        container.appendChild(status);
      }
    };
    img.onerror = () => {
      const container2 = document.getElementById(entry.previewId);
      if (container2) container2.innerHTML = '<span class="status warn">Couldn\'t load image</span>';
    };
    img.src = url;
  }

  function renderFiles(files) {
    groupsEl.innerHTML = '';
    previewCounter = 0;
    countEl.textContent = files.length
      ? `${files.length} file${files.length > 1 ? 's' : ''} selected`
      : '';

    const { byType, unclassified } = buildGroups(files);
    const imageEntries = [];

    DOCUMENT_TYPES.forEach(type => {
      const entries = byType.get(type.name);
      if (entries && entries.length) {
        groupsEl.appendChild(renderGroupCard(type.name, entries, false));
        entries.forEach(e => { if (e.file.type.startsWith('image/')) imageEntries.push(e); });
      }
    });

    if (unclassified.length) {
      groupsEl.appendChild(renderGroupCard('Unclassified', unclassified, true));
      unclassified.forEach(e => { if (e.file.type.startsWith('image/')) imageEntries.push(e); });
    }

    imageEntries.forEach(entry => processCropPreview(entry));
  }

  fileInput.addEventListener('change', (e) => {
    renderFiles(Array.from(e.target.files));
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });

  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files);
    fileInput.files = e.dataTransfer.files;
    renderFiles(files);
  });
</script>
</body>
</html>
