<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Logistics — Document Processor</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161c2c;
    --border: #2a3247;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f7cff;
    --warn: #e0a13b;
    --ok: #3bc48f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s ease;
    display: block;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
  }
  .dropzone p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .dropzone input {
    display: none;
  }
  .filelist {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fileitem {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .fileitem .left {
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }
  .fileitem .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fileitem .size {
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.matched {
    background: rgba(59, 196, 143, 0.15);
    color: var(--ok);
  }
  .badge.unclassified {
    background: rgba(224, 161, 59, 0.15);
    color: var(--warn);
  }
  .count {
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Document Processor — V0.1</h1>
  <div class="subtitle">Step 2: files are now matched to a document type by filename.</div>

  <label class="dropzone" id="dropzone">
    <p>Click to choose files, or drag and drop them here</p>
    <input type="file" id="fileInput" multiple>
  </label>

  <div class="count" id="count"></div>
  <div class="filelist" id="filelist"></div>
</div>

<script>
  // ---- Document types & aliases (editable config for now; config screen comes later) ----
  const DOCUMENT_TYPES = [
    { seq: 1,  name: "Police Verification",   aliases: ["police"] },
    { seq: 2,  name: "Resume",                aliases: ["resume"] },
    { seq: 3,  name: "Salary Slips",          aliases: ["salary slips"] },
    { seq: 4,  name: "Self Aadhaar",          aliases: ["aadhar"] },
    { seq: 5,  name: "HSC Marksheet",         aliases: ["hsc", "12th"] },
    { seq: 6,  name: "SSC Marksheet",         aliases: ["ssc", "10th"] },
    { seq: 7,  name: "Graduation",            aliases: ["graduation"] },
    { seq: 8,  name: "Mother Aadhaar Card",   aliases: ["mother aadhar"] },
    { seq: 9,  name: "Father Aadhaar Card",   aliases: ["father aadhar"] },
    { seq: 10, name: "Medical Fitness",       aliases: ["medical"] },
    { seq: 11, name: "PAN",                   aliases: ["pan"] },
    { seq: 12, name: "Passbook",              aliases: ["passbook", "bank account"] },
  ];

  // Flatten to a single list of {alias, type} pairs, so we can find the
  // longest matching alias across ALL types at once (most-specific wins).
  const ALIAS_INDEX = DOCUMENT_TYPES.flatMap(type =>
    type.aliases.map(alias => ({ alias: alias.toLowerCase(), type }))
  );

  function classify(filename) {
    const lower = filename.toLowerCase();
    let best = null;

    for (const entry of ALIAS_INDEX) {
      if (lower.includes(entry.alias)) {
        if (!best || entry.alias.length > best.alias.length) {
          best = entry;
        }
      }
    }

    return best ? best.type.name : "Unclassified";
  }

  // ---- UI wiring ----
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const filelist = document.getElementById('filelist');
  const countEl = document.getElementById('count');

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderFiles(files) {
    filelist.innerHTML = '';
    countEl.textContent = files.length
      ? `${files.length} file${files.length > 1 ? 's' : ''} selected`
      : '';

    files.forEach(file => {
      const detected = classify(file.name);

      const item = document.createElement('div');
      item.className = 'fileitem';

      const left = document.createElement('div');
      left.className = 'left';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = file.name;

      const size = document.createElement('div');
      size.className = 'size';
      size.textContent = formatSize(file.size);

      left.appendChild(name);
      left.appendChild(size);

      const badge = document.createElement('span');
      badge.className = 'badge ' + (detected === 'Unclassified' ? 'unclassified' : 'matched');
      badge.textContent = detected;

      item.appendChild(left);
      item.appendChild(badge);
      filelist.appendChild(item);
    });
  }

  fileInput.addEventListener('change', (e) => {
    renderFiles(Array.from(e.target.files));
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });

  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files);
    fileInput.files = e.dataTransfer.files;
    renderFiles(files);
  });
</script>
</body>
</html>
