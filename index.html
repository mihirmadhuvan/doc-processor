<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Logistics — Document Processor</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161c2c;
    --panel-2: #1c2337;
    --border: #2a3247;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f7cff;
    --warn: #e0a13b;
    --ok: #3bc48f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s ease;
    display: block;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
  }
  .dropzone p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .dropzone input {
    display: none;
  }
  .count {
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .groups {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .group-header .type {
    font-size: 14px;
    font-weight: 600;
  }
  .group-header .filecount {
    font-size: 12px;
    color: var(--muted);
  }
  .group.unclassified .group-header {
    background: rgba(224, 161, 59, 0.1);
  }
  .group.unclassified .group-header .type {
    color: var(--warn);
  }
  .fileitem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .fileitem:last-child {
    border-bottom: none;
  }
  .fileitem .left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    min-width: 0;
  }
  .pagebadge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(79, 124, 255, 0.12);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .fileitem .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fileitem .size {
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Document Processor — V0.1</h1>
  <div class="subtitle">Step 3: files are grouped by document type and ordered by trailing page number.</div>

  <label class="dropzone" id="dropzone">
    <p>Click to choose files, or drag and drop them here</p>
    <input type="file" id="fileInput" multiple>
  </label>

  <div class="count" id="count"></div>
  <div class="groups" id="groups"></div>
</div>

<script>
  // ---- Document types & aliases (editable config for now; config screen comes later) ----
  const DOCUMENT_TYPES = [
    { seq: 1,  name: "Police Verification",   aliases: ["police"] },
    { seq: 2,  name: "Resume",                aliases: ["resume"] },
    { seq: 3,  name: "Salary Slips",          aliases: ["salary slips"] },
    { seq: 4,  name: "Self Aadhaar",          aliases: ["aadhar"] },
    { seq: 5,  name: "HSC Marksheet",         aliases: ["hsc", "12th"] },
    { seq: 6,  name: "SSC Marksheet",         aliases: ["ssc", "10th"] },
    { seq: 7,  name: "Graduation",            aliases: ["graduation"] },
    { seq: 8,  name: "Mother Aadhaar Card",   aliases: ["mother aadhar"] },
    { seq: 9,  name: "Father Aadhaar Card",   aliases: ["father aadhar"] },
    { seq: 10, name: "Medical Fitness",       aliases: ["medical"] },
    { seq: 11, name: "PAN",                   aliases: ["pan"] },
    { seq: 12, name: "Passbook",              aliases: ["passbook", "bank account"] },
  ];

  // Flatten to a single list of {alias, type} pairs, so we can find the
  // longest matching alias across ALL types at once (most-specific wins).
  const ALIAS_INDEX = DOCUMENT_TYPES.flatMap(type =>
    type.aliases.map(alias => ({ alias: alias.toLowerCase(), type }))
  );

  function classify(filename) {
    const lower = filename.toLowerCase();
    let best = null;

    for (const entry of ALIAS_INDEX) {
      if (lower.includes(entry.alias)) {
        if (!best || entry.alias.length > best.alias.length) {
          best = entry;
        }
      }
    }

    return best ? best.type : null;
  }

  // Trailing number just before the extension orders pages within a group.
  // e.g. "father aadhar 1.jpg" -> 1, "12th 2.jpg" -> 2, "resume.pdf" -> null
  function extractPageNumber(filename) {
    const base = filename.replace(/\.[^/.]+$/, '');
    const match = base.match(/(\d+)\s*$/);
    return match ? parseInt(match[1], 10) : null;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ---- UI wiring ----
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const groupsEl = document.getElementById('groups');
  const countEl = document.getElementById('count');

  function buildGroups(files) {
    const byType = new Map(); // type.name -> array of {file, pageNum}
    const unclassified = [];

    files.forEach(file => {
      const type = classify(file.name);
      const pageNum = extractPageNumber(file.name);
      const entry = { file, pageNum };

      if (!type) {
        unclassified.push(entry);
        return;
      }
      if (!byType.has(type.name)) byType.set(type.name, []);
      byType.get(type.name).push(entry);
    });

    // Order pages within each group: numbered pages first (ascending),
    // then anything without a trailing number, in original selection order.
    for (const entries of byType.values()) {
      entries.sort((a, b) => {
        if (a.pageNum === null && b.pageNum === null) return 0;
        if (a.pageNum === null) return 1;
        if (b.pageNum === null) return -1;
        return a.pageNum - b.pageNum;
      });
    }

    return { byType, unclassified };
  }

  function renderGroupCard(title, entries, isUnclassified) {
    const card = document.createElement('div');
    card.className = 'group' + (isUnclassified ? ' unclassified' : '');

    const header = document.createElement('div');
    header.className = 'group-header';

    const typeEl = document.createElement('div');
    typeEl.className = 'type';
    typeEl.textContent = title;

    const countEl = document.createElement('div');
    countEl.className = 'filecount';
    countEl.textContent = entries.length + (entries.length === 1 ? ' file' : ' files');

    header.appendChild(typeEl);
    header.appendChild(countEl);
    card.appendChild(header);

    entries.forEach((entry, i) => {
      const item = document.createElement('div');
      item.className = 'fileitem';

      const left = document.createElement('div');
      left.className = 'left';

      if (!isUnclassified) {
        const badge = document.createElement('span');
        badge.className = 'pagebadge';
        badge.textContent = 'Page ' + (i + 1);
        left.appendChild(badge);
      }

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.file.name;
      left.appendChild(name);

      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = formatSize(entry.file.size);

      item.appendChild(left);
      item.appendChild(size);
      card.appendChild(item);
    });

    return card;
  }

  function renderFiles(files) {
    groupsEl.innerHTML = '';
    countEl.textContent = files.length
      ? `${files.length} file${files.length > 1 ? 's' : ''} selected`
      : '';

    const { byType, unclassified } = buildGroups(files);

    // Render in master sequence order, skipping types with no files.
    DOCUMENT_TYPES.forEach(type => {
      const entries = byType.get(type.name);
      if (entries && entries.length) {
        groupsEl.appendChild(renderGroupCard(type.name, entries, false));
      }
    });

    if (unclassified.length) {
      groupsEl.appendChild(renderGroupCard('Unclassified', unclassified, true));
    }
  }

  fileInput.addEventListener('change', (e) => {
    renderFiles(Array.from(e.target.files));
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });

  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files);
    fileInput.files = e.dataTransfer.files;
    renderFiles(files);
  });
</script>
</body>
</html>
